<script>
  // =========================================================================
  // 1. CONFIGURATION: PASTE YOUR GEMINI API KEY HERE
  // =========================================================================
  const GEMINI_API_KEY = "AQ.Ab8RN6JSbkDCMINl8ygN75PtLdqByX04PovvQfMZ4sHxP0nq0Q";

  // =========================================================================
  // 2. CORE AI CHECK FUNCTION
  // =========================================================================
  async function callGeminiAI(studentText, targetStructure, modelAnswer, outputDivId) {
    const outputDiv = document.getElementById(outputDivId);
    if (!outputDiv) return;

    if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
      outputDiv.className = "ai show err";
      outputDiv.innerHTML = "<strong>Configuration Error:</strong> Please insert your valid Gemini API Key in the script tag.";
      return;
    }

    if (!studentText || studentText.trim() === "") {
      outputDiv.className = "ai show err";
      outputDiv.innerHTML = "Please write a sentence before checking with the AI tutor.";
      return;
    }

    outputDiv.className = "ai show";
    outputDiv.innerHTML = "<em>Analyzing your writing with AI...</em>";

    const promptText = `
      You are an expert IELTS Writing examiner evaluating a student's Task 1 sentence.
      Target Grammar/Structure: "${targetStructure}"
      Reference Model Sentence: "${modelAnswer}"
      Student Submission: "${studentText}"

      Instructions:
      1. State directly if the target structure is used correctly.
      2. If incorrect, point out the exact grammar or structural error.
      3. Provide a corrected example using the target structure.
      Keep feedback clear, encouraging, and under 4 sentences.
    `;

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        }
      );

      const data = await response.json();

      if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
        const feedbackText = data.candidates[0].content.parts[0].text.replace(/\n/g, "<br>");
        outputDiv.className = "ai show ok";
        outputDiv.innerHTML = `<h4>AI Feedback</h4><div>${feedbackText}</div>`;
      } else {
        outputDiv.className = "ai show err";
        outputDiv.innerHTML = "Could not analyze response. Please check your API key or try again.";
      }
    } catch (error) {
      outputDiv.className = "ai show err";
      outputDiv.innerHTML = "Connection error. Please check your network connection.";
    }
  }

  // =========================================================================
  // 3. HANDLER FUNCTIONS FOR IN-PAGE BUTTONS
  // =========================================================================
  const STRUCTURE_METADATA = {
    1: {
      name: "Comparison Structure",
      model: "The percentage of women in the workforce is significantly lower than that of men, particularly in managerial and executive positions."
    },
    4: {
      name: "Dominance Structure",
      model: "The service sector accounted for over 70% of the country’s GDP in 2020, highlighting its dominance in the economy."
    },
    6: {
      name: "Proportion Structure",
      model: "The proportion of women in managerial positions in the company increased from 35% in 2018 to 45% in 2020."
    }
  };

  function check(cardId) {
    const textarea = document.getElementById(`a${cardId}`);
    const studentText = textarea ? textarea.value : "";
    const meta = STRUCTURE_METADATA[cardId] || { name: "IELTS Task 1 Structure", model: "" };
    callGeminiAI(studentText, meta.name, meta.model, `ai${cardId}`);
  }

  function transfer(cardId) {
    const textarea = document.getElementById(`t${cardId}`);
    const studentText = textarea ? textarea.value : "";
    const meta = STRUCTURE_METADATA[cardId] || { name: "IELTS Task 1 Structure Transfer", model: "" };
    callGeminiAI(studentText, `${meta.name} (Transfer Practice)`, meta.model, `ti${cardId}`);
  }

  function hint(cardId) {
    const outputDiv = document.getElementById(`ai${cardId}`);
    const meta = STRUCTURE_METADATA[cardId];
    if (outputDiv && meta) {
      outputDiv.className = "ai show";
      outputDiv.innerHTML = `💡 <strong>Hint:</strong> Try following this model frame:<br><em>${meta.model}</em>`;
    }
  }

  function resetCard(cardId) {
    const mainInput = document.getElementById(`a${cardId}`);
    const transferInput = document.getElementById(`t${cardId}`);
    const mainAI = document.getElementById(`ai${cardId}`);
    const transferAI = document.getElementById(`ti${cardId}`);

    if (mainInput) mainInput.value = "";
    if (transferInput) transferInput.value = "";
    if (mainAI) { mainAI.className = "ai"; mainAI.innerHTML = ""; }
    if (transferAI) { transferAI.className = "ai"; transferAI.innerHTML = ""; }
  }

  function saveEndpoint() {
    const statusDiv = document.getElementById("status");
    if (statusDiv) {
      statusDiv.className = "ai show ok";
      statusDiv.innerHTML = "Gemini API connection set to direct client-side execution.";
    }
  }

  function testAI() {
    callGeminiAI(
      "The percentage of cars produced in 2020 was higher than that in 2010.",
      "Comparison Structure",
      "The percentage of women in the workforce is significantly lower than that of men.",
      "status"
    );
  }
</script>
